name: Claude Code

# Issue / PR のコメントや Issue 本文に「@claude」と書くと Claude Code が対応します。
# 例) Issue に「@claude この不具合を修正して PR を出してください」とコメントする。
#
# 事前準備 (リポジトリ管理者が 1 回だけ):
#   Settings > Secrets and variables > Actions で ANTHROPIC_API_KEY を登録してください。
#   (詳細は CONTRIBUTING.md「Claude Code に Issue を任せる」を参照)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # @claude の言及があり、かつリポジトリオーナー本人の投稿のときだけ起動する
    # （公開リポジトリなので、第三者のコメントで API キーや書き込み権限を使わせない）
    if: |
      (github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association) == 'OWNER' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # 依存はエージェントに任せず、ここで requirements-dev.txt から固定的に入れる
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Claude Code
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # PR 検証と同じ pytest をエージェントも実行できるようにする（pip install は許可しない）
          claude_args: |
            --allowedTools "Bash(python -m pytest:*)"
