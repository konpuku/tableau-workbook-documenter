name: Claude Code

# Issue / PR のコメントや Issue 本文に「@claude」と書くと Claude Code が対応します。
# 例) Issue に「@claude この不具合を修正して PR を出してください」とコメントする。
#
# 事前準備 (リポジトリ管理者が 1 回だけ):
#   Settings > Secrets and variables > Actions で ANTHROPIC_API_KEY を登録してください。
#   (詳細は CONTRIBUTING.md「Claude Code に Issue を任せる」を参照)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # @claude の言及があるイベントのときだけ起動する
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # PR 検証と同じ pytest をエージェントも実行できるようにする
          claude_args: |
            --allowedTools "Bash(python -m pytest:*),Bash(python -m pip install:*)"
