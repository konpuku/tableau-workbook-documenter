name: Release

# v* タグの push で、配布用 zip を作って GitHub Release に添付する。
# 版 2 種 (単体版 standalone / Agent 版 agent) × 同梱 Python 2 種 (hyper なし / あり) = 4 個。
#
# - タグは app/twbdoc/__init__.py の __version__ と一致している必要がある (例: v0.8.1 ↔ "0.8.1")。
# - リリースノートは .github/release-notes/<タグ>.md を使う。1 行目の「# 」見出しをリリースの
#   タイトルにし、2 行目以降を本文にする。ファイルがなければ GitHub の自動生成ノートを使う。
# - 同じタグのリリースが既にあれば、zip だけを差し替える (再実行用)。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースする既存のタグ (例: v0.8.1)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish (${{ github.event.inputs.tag || github.ref_name }})
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check that the tag matches __version__
        shell: pwsh
        run: |
          $init = Get-Content app/twbdoc/__init__.py -Raw
          if ($init -notmatch '__version__\s*=\s*"([^"]+)"') { throw '__version__ not found in app/twbdoc/__init__.py' }
          $expected = "v$($Matches[1])"
          if ($env:TAG -ne $expected) { throw "Tag $env:TAG does not match __version__ ($expected)" }
          Write-Host "Tag $env:TAG matches __version__"

      # 同梱する embeddable 版 Python (build_distribution.ps1 の -PythonVersion 既定値) と
      # マイナーバージョンをそろえる。tableauhyperapi はこの Python の pip で
      # --target インストールされるため、ずれると依存パッケージのバイナリが合わなくなる。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      # 利用者と同じ Windows PowerShell 5.1 で実行する。
      # hyper なし版を先に作る (後から -WithHyperApi で同じ app\python に tableauhyperapi を足す)。
      - name: Build zips (with Python)
        shell: powershell
        run: |
          .\app\build_distribution.ps1 -Edition Standalone
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\app\build_distribution.ps1 -Edition Agent

      # setup_python.ps1 は py ランチャーを先に試すため、PY_PYTHON で上の Python を選ばせる。
      - name: Build zips (with Python + tableauhyperapi)
        shell: powershell
        env:
          PY_PYTHON: "3.14"
        run: |
          .\app\build_distribution.ps1 -Edition Standalone -WithHyperApi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\app\build_distribution.ps1 -Edition Agent -WithHyperApi

      - name: Smoke test the bundled Python
        shell: pwsh
        run: |
          $py = 'app\python\python.exe'
          & $py -c "import encodings, tableauhyperapi; print('stdlib and tableauhyperapi OK')"
          if ($LASTEXITCODE -ne 0) { throw 'The bundled Python could not import its modules' }
          $version = & $py -m twbdoc --version
          if ($LASTEXITCODE -ne 0) { throw 'twbdoc did not start with the bundled Python' }
          Write-Host $version
          if ($version -ne "twbdoc $($env:TAG.TrimStart('v'))") { throw "Unexpected version: $version" }
          $zips = @(Get-ChildItem dist -Filter '*.zip')
          if ($zips.Count -ne 4) { throw "Expected 4 zip files in dist, found $($zips.Count)" }
          $zips | ForEach-Object { Write-Host "$($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)" }
          # 利用者が使うファイルが zip に入っているか、版ごとに確認する
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $root = 'tableau-workbook-documenter'
          $common = @(
            "$root/generate_doc.bat",
            "$root/live_ci.bat",
            "$root/app/live_ci.ps1",
            "$root/app/twbdoc/assets/live.html"
          )
          # Agent 版だけに入るもの (build_distribution.ps1 の $AgentOnlyPaths と対応)
          $agentOnly = @(
            "$root/install_skill.bat",
            "$root/app/install_skill.ps1",
            "$root/app/skills/twbdoc-ci/SKILL.md",
            "$root/app/skills/twbdoc-ci/scripts/twbdoc_ci.py"
          )
          foreach ($edition in @('standalone', 'agent')) {
            $editionZips = @($zips | Where-Object { $_.Name -like "*-$edition-with-python*" })
            if ($editionZips.Count -ne 2) { throw "Expected 2 $edition zips, found $($editionZips.Count)" }
            foreach ($zip in $editionZips) {
              $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
              try {
                $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
              } finally {
                $archive.Dispose()
              }
              $required = if ($edition -eq 'agent') { $common + $agentOnly } else { $common }
              $missing = @($required | Where-Object { $entries -notcontains $_ })
              if ($missing.Count -gt 0) { throw "$($zip.Name) is missing: $($missing -join ', ')" }
              if ($edition -eq 'standalone') {
                $extra = @($entries | Where-Object { $_ -like "$root/app/skills/*" -or $_ -like "*install_skill*" })
                if ($extra.Count -gt 0) { throw "$($zip.Name) must not contain: $($extra -join ', ')" }
              }
            }
          }

      - name: Create or update the GitHub Release
        shell: pwsh
        run: |
          $zips = @(Get-ChildItem dist -Filter '*.zip' | ForEach-Object FullName)
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists. Replacing its zip files."
            gh release upload $env:TAG @zips --clobber
            if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }
            exit 0
          }

          $notesPath = ".github/release-notes/$env:TAG.md"
          if (Test-Path $notesPath) {
            $lines = @(Get-Content $notesPath -Encoding utf8)
            if ($lines.Count -gt 0 -and $lines[0] -match '^#\s+(.+)$') {
              $title = $Matches[1].Trim()
              $body = $lines | Select-Object -Skip 1
            } else {
              $title = $env:TAG
              $body = $lines
            }
            $bodyFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            (($body -join "`n").Trim() + "`n") | Set-Content $bodyFile -Encoding utf8NoBOM -NoNewline
            gh release create $env:TAG @zips --verify-tag --title $title --notes-file $bodyFile
          } else {
            Write-Host "$notesPath not found. Using generated release notes."
            gh release create $env:TAG @zips --verify-tag --title $env:TAG --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
